services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Database=${POSTGRES_DB:-bpmn_properties};Username=${POSTGRES_USER:-bpmn_properties};Password=${POSTGRES_PASSWORD:-change-me-for-local-use}
      Storage__LocalPath: /app/storage
      Auth__JwtKey: ${AUTH_JWT_KEY:-change-me-gaia-bpmn-local-jwt-secret-key-min-32-chars}
      Auth__JwtIssuer: ${AUTH_JWT_ISSUER:-gaia-bpmn-api}
      Auth__JwtAudience: ${AUTH_JWT_AUDIENCE:-gaia-bpmn-desktop}
      Auth__AdminUsername: ${AUTH_ADMIN_USERNAME:-admin}
      Auth__AdminPassword: ${AUTH_ADMIN_PASSWORD:-admin123}
      Auth__AdminDisplayName: ${AUTH_ADMIN_DISPLAY_NAME:-Administrador}
      Cors__AllowedOrigins__0: ${CORS_ALLOWED_ORIGIN_DEV:-http://localhost:5173}
      Cors__AllowedOrigins__1: ${CORS_ALLOWED_ORIGIN_ELECTRON:-null}
      Cors__AllowedOrigins__2: http://127.0.0.1:5173
    ports:
      - "8080:8080"
    volumes:
      - api-storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bpmn_properties}
      POSTGRES_USER: ${POSTGRES_USER:-bpmn_properties}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-for-local-use}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  api-storage:
